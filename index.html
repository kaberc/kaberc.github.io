<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>kaberc</title>
        <meta name="description" content="kaberc lives here">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">

        <meta property="og:type" content="website">
        <meta property="og:url" content="https://kaberc.com/">
        <meta property="og:title" content="kaberc">
        <meta property="og:description" content="kaberc lives here">

        <style>
         html {
             --bg-color: white;
             --fg-color: black;
             background-color: var(--bg-color);
             color: var(--fg-color);
             transition: 1s linear;
         }

         body {
             height: 100dvh;
             margin: 0;
             display: flex;
             align-items: center;
             justify-content: center;
         }

         .info-block {
             box-sizing: border-box;
             width: 100%;
             max-width: 30rem;
             padding-inline: 1rem;
             height: 80dvh;
         }

         .big-k-letter {
             margin: 0;
             font-size: min(70dvh, 120vw);
             line-height: 1;
             text-align: center;
         }

         ul {
             list-style: none;
             padding: 0;
         }

         a {
             color: unset;
         }
        </style>

        <script>
         {
             const style = document.documentElement.style;

             setInterval(() => {
                 const bgColor = "hsl(" + Math.round(Math.random() * 90 + 180) + ',' +
                                 Math.round(Math.random() * 20 + 40) + '%,' +
                                 Math.round(Math.random() * 20 + 20) + '%)';

                 const fgColor = "hsl(" + Math.round(Math.random() * 90 + 180) + ',' +
                                 Math.round(Math.random() * 20 + 40) + '%,' +
                                 Math.round(Math.random() * 20 + 60) + '%)';

                 style.setProperty('--bg-color', bgColor);
                 style.setProperty('--fg-color', fgColor);
             }, 1000);
         }
        </script>
    </head>
    <body>
        <div class="info-block">
            <h1 class="big-k-letter">k</h1>
            <ul>
                <li>telegram: <a target="_blank" rel="noopener" href="https://t.me/kaberc">kaberc</a></li>
                <li>e-mail: <a href="mailto:kaberc@gmail.com">kaberc@gmail.com</a></li>
            </ul>
        </div>
    </body>
</html>
